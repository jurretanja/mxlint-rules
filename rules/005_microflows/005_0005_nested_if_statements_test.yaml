TestCases:
- name: allow one exclusive split without nested if-statements
  allow: true
  input:
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$ExclusiveSplit
          Caption: no nested ifs
          SplitCondition:
            Expression: if $Variable then a else b

- name: allow multiple exclusive splits without nested if-statements
  allow: true
  input:
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$ExclusiveSplit
          Caption: ex split 1 with no nested ifs
          SplitCondition:
            Expression: if $Variable then a else b
        - $Type: Microflows$ExclusiveSplit
          Caption: ex split 2 with no nested ifs
          SplitCondition:
            Expression: if $Variable then c else d

- name: do not allow exclusive split with an else-if
  allow: false
  input:
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$ExclusiveSplit
          Caption: ex split with else-if
          SplitCondition:
            Expression: "if true then\n\tfalse\nelse if false then\n\ttrue\nelse false"

- name: do not allow exclusive split with a then-if
  allow: false
  input:
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$ExclusiveSplit
          Caption: ex split with then-if
          SplitCondition:
            Expression: if a then if b then c else d else e

- name: do not allow multiple exclusive splits where one has a nested if
  allow: false
  input:
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$ExclusiveSplit
          Caption: no nested ifs
          SplitCondition:
            Expression: if $Variable then a else b
        - $Type: Microflows$ExclusiveSplit
          Caption: ex split with then-if
          SplitCondition:
            Expression: if a then b else if c then d else e
